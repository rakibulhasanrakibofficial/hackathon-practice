
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7ff" />
  <title>Rakib's AI Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#">
        <div class="brand-logo">R</div>
        <div>
          <h1>Rakib's AI Assistant</h1>
          <p>Your personal AI companion</p>
        </div>
      </a>
      <button id="clearChat" class="clear-btn">↻ Clear Chat</button>
    </header>

    <main class="chat-area" id="chatArea">
      <section class="welcome" id="welcome">
        <div class="hero-icon">✦</div>
        <p class="eyebrow">YOUR PERSONAL AI</p>
        <h2>Hello, welcome! <span>👋</span></h2>
        <p class="welcome-text">
          I'm here to help you learn, create, and solve problems.
          What would you like to explore today?
        </p>

        <div class="suggestions">
          <button class="suggestion" data-prompt="Explain a difficult topic in simple words">
            <span class="suggestion-icon purple">✧</span>
            <span><b>Learn something</b><small>Understand any topic</small></span>
            <span class="suggestion-arrow">↗</span>
          </button>
          <button class="suggestion" data-prompt="Help me write clean JavaScript code">
            <span class="suggestion-icon blue">&lt;/&gt;</span>
            <span><b>Write some code</b><small>Build and debug projects</small></span>
            <span class="suggestion-arrow">↗</span>
          </button>
          <button class="suggestion" data-prompt="Give me a step-by-step explanation of an idea">
            <span class="suggestion-icon pink">☷</span>
            <span><b>Explain an idea</b><small>Step-by-step guidance</small></span>
            <span class="suggestion-arrow">↗</span>
          </button>
          <button class="suggestion" data-prompt="Help me brainstorm creative ideas">
            <span class="suggestion-icon orange">✳</span>
            <span><b>Get creative</b><small>Explore new possibilities</small></span>
            <span class="suggestion-arrow">↗</span>
          </button>
        </div>
      </section>

      <div id="messages" class="messages" aria-live="polite"></div>
    </main>

    <footer class="composer-wrap">
      <form id="chatForm" class="composer">
        <textarea
          id="messageInput"
          rows="1"
          maxlength="4000"
          placeholder="Ask me anything..."
          aria-label="Your message"
          required
        ></textarea>
        <div class="composer-bottom">
          <span class="input-hint"><span class="online-dot"></span> Ready to help</span>
          <button id="sendBtn" type="submit" class="send-btn">
            Send <span>↑</span>
          </button>
        </div>
      </form>
      <p class="keyboard-hint">Enter to send · Shift + Enter for a new line</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
