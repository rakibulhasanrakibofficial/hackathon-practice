
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemma AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5fb;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 12px;
    }

    .app {
      width: 100%;
      max-width: 800px;
      height: min(780px, calc(100vh - 48px));
      min-height: 480px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 45px rgba(30, 41, 59, 0.10);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 20px 24px;
      border-bottom: 1px solid #e8edf5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #4f46e5;
      color: white;
      display: grid;
      place-items: center;
      font-size: 23px;
      font-weight: bold;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 5px;
    }

    .subtitle {
      font-size: 12px;
      color: #64748b;
    }

    button, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .clear-btn {
      background: white;
      border: 1px solid #dbe2ed;
      border-radius: 10px;
      padding: 9px 12px;
      color: #475569;
    }

    .clear-btn:hover {
      background: #f1f5f9;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .welcome {
      margin: auto;
      text-align: center;
      max-width: 400px;
      padding: 20px;
    }

    .welcome-icon {
      font-size: 44px;
      margin-bottom: 12px;
    }

    .welcome h2 {
      margin: 0 0 10px;
      font-size: 23px;
    }

    .welcome p {
      color: #64748b;
      line-height: 1.6;
      font-size: 14px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      gap: 6px;
    }

    .message.user {
      align-self: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .label {
      font-size: 12px;
      color: #64748b;
    }

    .bubble {
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .user .bubble {
      background: #4f46e5;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .assistant .bubble {
      background: #f1f5f9;
      color: #1e293b;
      border-bottom-left-radius: 4px;
    }

    .error .bubble {
      background: #fff1f2;
      color: #be123c;
    }

    .typing {
      color: #64748b;
      font-size: 13px;
      padding: 10px 2px;
    }

    .typing span {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.25; }
    }

    .composer {
      padding: 18px 20px;
      border-top: 1px solid #e8edf5;
      background: #fff;
    }

    .input-area {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 8px;
      border: 1px solid #dbe2ed;
      border-radius: 16px;
      background: #fff;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      padding: 10px;
      min-height: 44px;
      max-height: 120px;
      background: transparent;
      color: #1e293b;
      line-height: 1.5;
    }

    .send-btn {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: bold;
    }

    .send-btn:hover {
      background: #4338ca;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .hint {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 10px;
    }

    @media (max-width: 520px) {
      body {
        padding: 0;
      }

      .app {
        height: 100vh;
        min-height: 400px;
        border-radius: 0;
      }

      header {
        padding: 16px;
      }

      #chat {
        padding: 16px;
      }

      .composer {
        padding: 12px;
      }

      .message {
        max-width: 95%;
      }

      h1 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo">G</div>
        <div>
          <h1>Gemma AI Assistant</h1>
          <div class="subtitle">Powered by your local AI model</div>
        </div>
      </div>

      <button id="clearBtn" class="clear-btn" type="button">
        Clear Chat
      </button>
    </header>

    <section id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✦</div>
        <h2>কী জানতে চাও?</h2>
        <p>
          তোমার প্রশ্ন লেখো। Gemma AI তোমাকে উত্তর দিতে সাহায্য করবে।
          বাংলা বা ইংরেজি—দুই ভাষাতেই প্রশ্ন করতে পারো।
        </p>
      </div>
    </section>

    <form id="chatForm" class="composer">
      <div class="input-area">
        <textarea
          id="question"
          rows="1"
          placeholder="এখানে প্রশ্ন লেখো..."
          aria-label="তোমার প্রশ্ন"
          required
        ></textarea>

        <button id="sendBtn" class="send-btn" type="submit">
          Send ↑
        </button>
      </div>
      <div class="hint">
        Enter দিয়ে Send করো · নতুন লাইনের জন্য Shift + Enter
      </div>
    </form>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("question");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");

    let busy = false;

    function addMessage(role, text, isError = false) {
      const welcome = document.getElementById("welcome");
      if (welcome) welcome.remove();

      const message = document.createElement("div");
      message.className = `message ${role}`;

      if (isError) message.classList.add("error");

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = role === "user" ? "You" : "Gemma AI";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      message.append(label, bubble);
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    function showWelcome() {
      chat.innerHTML = `
        <div class="welcome" id="welcome">
          <div class="welcome-icon">✦</div>
          <h2>কী জানতে চাও?</h2>
          <p>
            তোমার প্রশ্ন লেখো। Gemma AI তোমাকে উত্তর দিতে সাহায্য করবে।
            বাংলা বা ইংরেজি—দুই ভাষাতেই প্রশ্ন করতে পারো।
          </p>
        </div>
      `;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (busy) return;

      const question = input.value.trim();
      if (!question) return;

      busy = true;
      sendBtn.disabled = true;
      input.disabled = true;

      addMessage("user", question);
      input.value = "";

      const loading = document.createElement("div");
      loading.className = "typing";
      loading.textContent = "Gemma ভাবছে";
      const dots = document.createElement("span");
      dots.textContent = "...";
      loading.appendChild(dots);
      chat.appendChild(loading);
      chat.scrollTop = chat.scrollHeight;

      
try {
  const response = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question })
  });

  if (!response.ok || !response.body) {
    const data = await response.json();
    throw new Error(data.error || "Request failed");
  }

  const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let assistantMessage = null;
      let bubble = null;

      while (true) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });

        const events = buffer.split(/\r?\n\r?\n/);
        buffer = events.pop() || "";

        for (const event of events) {
          const line = event.split(/\r?\n/).find(line => line.startsWith("data: "));
          if (!line) continue;

          const payload = line.slice(6).trim();
          if (!payload || payload === "[DONE]") continue;

          const data = JSON.parse(payload);
          if (data.error) throw new Error(data.error);

          if (data.token) {
            // Keep the typing indicator until the first token arrives.
            if (!assistantMessage) {
              loading.remove();
              assistantMessage = addMessage("assistant", "");
              bubble = assistantMessage.querySelector(".bubble");
            }

            bubble.textContent += data.token;
            chat.scrollTop = chat.scrollHeight;
          }
        }

        if (done) break;
      }

      // Process a final event if the stream ends without a trailing blank line.
      if (buffer.trim()) {
        const line = buffer.split(/\r?\n/).find(line => line.startsWith("data: "));
        if (line) {
          const payload = line.slice(6).trim();
          if (payload && payload !== "[DONE]") {
            const data = JSON.parse(payload);
            if (data.error) throw new Error(data.error);

            if (data.token) {
              if (!assistantMessage) {
                loading.remove();
                assistantMessage = addMessage("assistant", "");
                bubble = assistantMessage.querySelector(".bubble");
              }
              bubble.textContent += data.token;
            }
          }
        }
      }

      loading.remove();

      if (!bubble || !bubble.textContent.trim()) {
        throw new Error("AI returned an empty answer. Please try again.");
      }

    } catch (error) {
      loading.remove();
      addMessage("assistant", "সমস্যা: " + error.message, true);
    } finally {
  busy = false;
  sendBtn.disabled = false;
  input.disabled = false;
  input.focus();
}

    });

    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    clearBtn.addEventListener("click", function () {
      if (busy) return;
      showWelcome();
      input.focus();
    });

    input.addEventListener("input", function () {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });
  </script>
</body>
</html>
